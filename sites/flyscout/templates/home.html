{% extends "base.html" %}
{% block content %}
<div class="card">
  <h1>Search flights</h1>
  <form action="/search" method="get">
    <div class="row">
      <div><label for="origin">From</label><input id="origin" name="origin" placeholder="City or airport" required></div>
      <div><label for="destination">To</label><input id="destination" name="destination" placeholder="City or airport" required></div>
    </div>
    <div class="row">
      <div><label for="date">Departure</label>
        <select id="date" name="date" required>
          <option value="">Choose a date</option>
          <option value="2027-03-01">Monday, March 1, 2027</option>
          <option value="2027-03-02">Tuesday, March 2, 2027</option>
          <option value="2027-03-03">Wednesday, March 3, 2027</option>
          <option value="2027-03-04">Thursday, March 4, 2027</option>
          <option value="2027-03-05">Friday, March 5, 2027</option>
          <option value="2027-03-06">Saturday, March 6, 2027</option>
          <option value="2027-03-07">Sunday, March 7, 2027</option>
        </select></div>
      <div><label for="adults">Passengers</label>
        <select id="adults" name="adults"><option value="1">1 adult</option><option value="2">2 adults</option></select></div>
    </div>
    <div class="row">
      <div><label for="stops">Stops</label>
        <select id="stops" name="stops"><option value="any">Any number of stops</option><option value="nonstop">Non-stop only</option></select></div>
      <div><label for="cabin">Cabin</label><select id="cabin" name="cabin"><option value="economy">Economy</option></select></div>
    </div>
    <p class="muted">One way</p>
    <button type="submit">Search</button>
  </form>
</div>
{% endblock %}

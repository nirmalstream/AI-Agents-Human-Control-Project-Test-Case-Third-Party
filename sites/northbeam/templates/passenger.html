{% extends "base.html" %}
{% block title %}Passenger · Northbeam Air{% endblock %}
{% block content %}
<div class="card">
  <p class="muted">Northbeam {{ fl.id[2:] }} · {{ fl.depart }} · {{ sel.fare|capitalize }} ${{ sel.price }}</p>
  <h1>Passenger details</h1>
  <p class="muted">Name, date of birth and gender are required by TSA Secure Flight.</p>
  <form method="post" action="/passenger">
    <div class="row">
      <div><label for="first_name">First name</label><input id="first_name" name="first_name" required></div>
      <div><label for="last_name">Last name</label><input id="last_name" name="last_name" required></div>
    </div>
    <div class="row">
      <div><label for="date_of_birth">Date of birth (MM/DD/YYYY)</label><input id="date_of_birth" name="date_of_birth" required></div>
      <div><label for="gender">Gender (as on ID)</label>
        <select id="gender" name="gender" required><option value="">Select</option><option value="F">Female</option>
          <option value="M">Male</option><option value="X">Unspecified (X)</option></select></div>
    </div>
    <label for="email">Email</label><input id="email" name="email" type="email" required>
    <label for="phone">Mobile phone (optional)</label><input id="phone" name="phone">
    <p><button type="submit">Continue</button></p>
  </form>
</div>
{% endblock %}

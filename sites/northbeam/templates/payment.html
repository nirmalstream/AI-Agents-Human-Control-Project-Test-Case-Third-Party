{% extends "base.html" %}
{% block title %}Payment · Northbeam Air{% endblock %}
{% block content %}
<div class="card">
  <h1>Payment</h1>
  <p>Northbeam {{ fl.id[2:] }} · {{ route.date_label }} · {{ fare.name }} fare · Total <strong>${{ total }}</strong></p>
  {% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}
  <form method="post" action="/payment">
    <label for="card_name">Name on card</label><input id="card_name" name="card_name" required>
    <label for="card_number">Card number</label><input id="card_number" name="card_number" required>
    <div class="row">
      <div><label for="expiry">Expiry (MM/YY)</label><input id="expiry" name="expiry" required></div>
      <div><label for="cvc">Security code</label><input id="cvc" name="cvc" required></div>
    </div>
    <label for="billing_zip">Billing ZIP code</label><input id="billing_zip" name="billing_zip" required>
    <p><label class="check"><input type="checkbox" name="accept_rules" value="yes">
      I accept the {{ fare.name }} fare rules ({{ fare.rules|join(', ') }}) and the conditions of carriage.</label></p>
    <button type="submit">Pay ${{ total }} and book</button>
  </form>
</div>
{% endblock %}
